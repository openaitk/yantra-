name: Uptime watchdog

# Every 15 minutes checks the website and API from outside. Opens ONE Issue when something is down
# (GitHub emails you) and closes it again when everything is back.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site and API
        id: chk
        run: |
          fail=""
          code() { curl -s -o /dev/null -m 20 -w '%{http_code}' -A 'yantra-watchdog' "$1" || echo 000; }
          for u in https://apikeys.in/ https://api.aitklabs.in/health https://api.aitklabs.in/app/models; do
            c=$(code "$u"); [ "$c" = "200" ] || { sleep 20; c=$(code "$u"); }
            [ "$c" = "200" ] || fail="$fail\n- $u answered HTTP $c"
          done
          if [ -n "$fail" ]; then
            echo "down=true" >> "$GITHUB_OUTPUT"
            { echo "Checked at $(date -u '+%F %T') UTC. Failing:"; printf '%b\n' "$fail"; echo; echo "The server watchdog should restart the app by itself. If this stays open, log in and run: pm2 restart yantra"; } > body.md
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the Issue
        if: steps.chk.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --state open --label outage --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh label create outage --color B60205 2>/dev/null || true
            gh issue create --title "Site or API is DOWN" --label outage --body-file body.md
          else
            gh issue comment "$n" --body-file body.md
          fi
      - name: Close the Issue when recovered
        if: steps.chk.outputs.down == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --label outage --json number -q '.[].number'); do
            gh issue close "$n" --comment "Back up at $(date -u '+%F %T') UTC."
          done
